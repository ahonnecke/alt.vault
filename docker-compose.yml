services:
  db:
    image: postgres:16-alpine
    container_name: altvault-db
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5434:5432"
    volumes:
      - altvault_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  altvault_pg:
